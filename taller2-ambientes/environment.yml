# Ambiente de Conda equivalente al requirements.txt (punto 4 del taller)
# Crear con:      conda env create -f environment.yml
# Actualizar con: conda env update -f environment.yml --prune
name: taller2-ml
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.26,<3.0
  - pandas>=2.1,<3.0
  - scikit-learn>=1.4,<2.0
  - joblib>=1.3,<2.0
  - matplotlib>=3.8,<4.0
  - seaborn>=0.13,<1.0
  - jupyterlab>=4.0,<5.0
  - ipykernel>=6.29,<8.0
  - pytest>=8.0,<9.0
  - pip
  # Paquetes que solo existen en PyPI (o que se prefiere instalar con pip)
  - pip:
      - build>=1.0
